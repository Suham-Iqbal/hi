<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f5f5f5 100%);
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Left Sidebar */
        .sidebar {
            width: 280px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            position: relative;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .user-profile {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .online-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #28a745;
            border: 2px solid white;
            border-radius: 50%;
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
        }

        .user-info p {
            font-size: 12px;
            color: #6c757d;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8f9fa;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .notification-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #dc3545;
            border: 2px solid white;
            border-radius: 50%;
        }

        .chat-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
        }

        .chat-info p {
            font-size: 12px;
            color: #28a745;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.received .message-bubble {
            background: white;
            color: #212529;
            border-bottom-left-radius: 4px;
        }

        .message.sent .message-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            text-align: right;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .message.received .message-time {
            text-align: left;
        }

        .message-status {
            margin-left: 4px;
            font-size: 12px;
        }

        .message.sent .message-status {
            color: #28a745;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background: white;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 24px;
            font-size: 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .send-button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #007bff;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }

        .send-button:hover {
            background: #0056b3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        /* Watermarks */
        .watermark {
            position: fixed;
            color: rgba(0, 0, 0, 0.1);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
        }

        .watermark.shutterstock {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .watermark.bankobstock {
            bottom: 20px;
            right: 20px;
            font-size: 18px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .chat-container {
                border-radius: 0;
                height: 100vh;
            }
            
            .sidebar {
                width: 100%;
                height: 100%;
                position: absolute;
                z-index: 10;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
        }

        /* Scrollbar Styling */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- Watermarks -->
    <div class="watermark shutterstock">Shutterstock</div>
    <div class="watermark bankobstock">Bankobstock</div>

    <div class="chat-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="search-container">
                <div style="position: relative;">
                    <input type="text" class="search-input" placeholder="Search" id="searchInput">
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar">
                    <span>UN</span>
                    <div class="online-status"></div>
                </div>
                <div class="user-info">
                    <h3>User Name</h3>
                    <p>Online</p>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-avatar">
                    <span>UN</span>
                    <div class="notification-dot"></div>
                </div>
                <div class="chat-info">
                    <h3>User Name</h3>
                    <p>Online</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be populated by JavaScript -->
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        class="message-input" 
                        placeholder="Message..." 
                        id="messageInput"
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendButton">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample conversation data
        const conversation = [
            {
                type: 'received',
                text: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
                time: '22:01'
            },
            {
                type: 'sent',
                text: 'Lorem ipsum dolor sit amet',
                time: '22:02'
            },
            {
                type: 'received',
                text: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.',
                time: '22:11'
            },
            {
                type: 'sent',
                text: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
                time: '22:12'
            },
            {
                type: 'received',
                text: 'Lorem ipsum dolor sit amet',
                time: '22:15'
            },
            {
                type: 'sent',
                text: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.',
                time: '22:16'
            },
            {
                type: 'received',
                text: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
                time: '22:20'
            },
            {
                type: 'sent',
                text: 'Lorem ipsum dolor sit amet',
                time: '22:21'
            }
        ];

        // Function to render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            conversation.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.type}`;
                
                if (message.type === 'received') {
                    messageElement.innerHTML = `
                        <div class="message-avatar">
                            <span>UN</span>
                        </div>
                        <div class="message-bubble">
                            <div class="message-text">${message.text}</div>
                            <div class="message-time">${message.time}</div>
                        </div>
                    `;
                } else {
                    messageElement.innerHTML = `
                        <div class="message-bubble">
                            <div class="message-text">${message.text}</div>
                            <div class="message-time">${message.time} <i class="fas fa-check-double message-status"></i></div>
                        </div>
                    `;
                }
                
                container.appendChild(messageElement);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Auto-resize textarea
        function autoResizeTextarea() {
            const textarea = document.getElementById('messageInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // Send message function
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text) {
                const newMessage = {
                    type: 'sent',
                    text: text,
                    time: new Date().toLocaleTimeString('en-US', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false 
                    })
                };
                
                conversation.push(newMessage);
                renderMessages();
                input.value = '';
                input.style.height = 'auto';
            }
        }

        // Event listeners
        document.getElementById('messageInput').addEventListener('input', autoResizeTextarea);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        document.getElementById('sendButton').addEventListener('click', sendMessage);

        // Initialize
        renderMessages();

        // Add some interactivity
        document.getElementById('searchInput').addEventListener('input', function(e) {
            console.log('Searching for:', e.target.value);
        });
    </script>
</body>
</html>
